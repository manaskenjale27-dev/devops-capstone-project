apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
      description: Public Git repository URL
    - name: branch
      type: string
      default: main
    - name: image
      type: string
      description: Image name/tag to build
      default: accounts:latest
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: pipeline-workspace
    - name: test-and-lint
      runAfter:
        - clone
      taskRef:
        name: echo
      params:
        - name: message
          value: "Source cloned. Configure lab-provided lint/test ClusterTasks before enabling deployment."
