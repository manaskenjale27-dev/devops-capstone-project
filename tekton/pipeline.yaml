apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
      description: Public repository URL to clone
    - name: branch
      type: string
      default: main
    - name: image
      type: string
      description: Full image name to build and push
      default: image-registry.openshift-image-registry.svc:5000/$(context.taskRun.namespace)/accounts:latest
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: pipeline-workspace
    - name: lint
      runAfter:
        - clone
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: tests
      runAfter:
        - lint
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: build
      runAfter:
        - tests
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: deploy
      runAfter:
        - build
      taskRef:
        name: openshift-client
      params:
        - name: SCRIPT
          value: |
            oc apply -f deploy/deployment.yaml
            oc rollout status deployment/accounts
      workspaces:
        - name: manifest-dir
          workspace: pipeline-workspace
