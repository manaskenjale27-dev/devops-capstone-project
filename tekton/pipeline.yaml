apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
      description: Public Git repository URL
    - name: branch
      type: string
      default: main
    - name: image
      type: string
      description: Full image registry path used for build and deployment
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: pipeline-workspace
    - name: test-and-lint
      runAfter:
        - clone
      taskRef:
        name: test-and-lint
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: build
      runAfter:
        - test-and-lint
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.image)
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: deploy
      runAfter:
        - build
      taskRef:
        name: openshift-client
      params:
        - name: SCRIPT
          value: |
            set -eu
            oc apply -f deploy/deployment.yaml
            oc set image deployment/accounts accounts=$(params.image)
            oc rollout status deployment/accounts --timeout=180s
      workspaces:
        - name: manifest-dir
          workspace: pipeline-workspace
